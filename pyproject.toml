[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a-mem-fast"
version = "0.1.0"
description = "Measured infrastructure and optional fused-evolution optimizations for A-Mem"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy>=1.24", "sentence-transformers>=3", "scikit-learn>=1.3",
  "torch>=2", "transformers>=4.45", "nltk>=3.9", "rank-bm25>=0.2.2",
  "litellm>=1.40", "openai>=1.40", "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["matplotlib>=3.8"]
upstream-evaluation = ["ollama", "rouge-score", "bert-score", "pandas", "python-dotenv"]

[tool.setuptools]
py-modules = ["memory_layer", "memory_layer_robust", "llm_text_parsers"]

[tool.setuptools.packages.find]
include = ["fast_amem*"]
exclude = ["tests*", "docs*", "data*", "results*"]
