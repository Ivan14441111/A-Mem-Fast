name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install 'torch==2.9.0+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-fast.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python scripts/benchmark_suite.py --plan-only --include-fused --samples 0 1 2 --turns 128 --repeats 3 --max-questions 12 --output /tmp/benchmark-plan
